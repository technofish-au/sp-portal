# sp-portal API skeleton (R5-1 foundation).
#
# Only GET /healthz has a handler today. The /v1/* paths below document the
# intended shape for later waves; the router mounts domain packages under
# /v1 (see internal/httpapi/router.go) as they land.
openapi: 3.1.0
info:
  title: ServerPerch Portal API
  version: 0.1.0
  description: |
    Customer portal + licensing backend for the ServerPerch on-prem
    monitoring appliance: organisations, licences, registered appliances,
    releases and downloads.
servers:
  - url: /
tags:
  - name: meta
    description: Service metadata (unauthenticated)
  - name: auth
    description: Accounts + sessions (R5-3)
  - name: organisations
  - name: billing
    description: Stripe billing (R5-3)
  - name: licences
  - name: instances
  - name: releases

paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness/readiness check
      description: |
        200 when the process is up and the database is reachable,
        503 otherwise. Used by container HEALTHCHECKs.
      operationId: getHealthz
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                required: [status, detail]
                properties:
                  status: { type: string, enum: [unavailable] }
                  detail: { type: string }

  # --- R5-3: accounts + billing -----------------------------------------

  /stripe/webhook:
    post:
      tags: [billing]
      summary: Stripe webhook inbox
      description: |
        Stripe-Signature verified, the raw event is stored in
        stripe_events (unique event_id — redeliveries are idempotent) and
        a billing.stripe_event job is enqueued for the worker. Always
        answers quickly; processing is asynchronous.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      responses:
        "200": { description: Event stored (or idempotent duplicate) }
        "400": { description: Bad signature or payload }
        "503": { description: Webhook secret not configured }

  /v1/auth/altcha:
    get:
      tags: [auth]
      summary: Issue an ALTCHA proof-of-work challenge
      responses:
        "200": { description: Challenge JSON }
        "404": { description: Captcha not configured (dev bypass) }
  /v1/auth/signup:
    post:
      tags: [auth]
      summary: Create account + org + 30-day/25-machine trial
      description: |
        Creates the user (Argon2id), organisation, owner membership, trial
        subscription and trial licence; queues a verification email.
        Session stage is "setup" — new owners must enrol TOTP before
        reaching a full session.
      responses:
        "201": { description: Created; session cookie set }
        "400": { description: Validation error }
        "403": { description: Captcha failed }
        "409": { description: Email already registered }
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Password login
      description: |
        Returns status ok | totp_required | totp_setup_required and sets
        the session cookie at the matching stage (pending stages only
        reach the TOTP endpoints).
      responses:
        "200": { description: Login status + user }
        "401": { description: Bad credentials }
  /v1/auth/login/totp:
    post:
      tags: [auth]
      summary: Finish a totp_required login
      responses:
        "200": { description: Full session issued }
        "401": { description: Bad code or no pending session }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Clear the session cookie
      responses:
        "204": { description: Logged out }
  /v1/auth/verify-email:
    get:
      tags: [auth]
      summary: Consume an email-verification token (idempotent)
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Verified }
        "400": { description: Invalid or expired token }
  /v1/auth/me:
    get:
      tags: [auth]
      summary: Current session user + org memberships
      responses:
        "200": { description: user, email_verified, organisations }
        "401": { description: Not authenticated }
  /v1/auth/resend-verification:
    post:
      tags: [auth]
      summary: Queue a fresh verification email
      responses:
        "204": { description: Queued }
        "401": { description: Not authenticated }
  /v1/auth/totp/setup:
    post:
      tags: [auth]
      summary: Begin TOTP enrolment (any session stage)
      responses:
        "200": { description: provisioning_uri + secret }
        "401": { description: Not authenticated }
  /v1/auth/totp/enable:
    post:
      tags: [auth]
      summary: Verify a code and enable TOTP (upgrades pending sessions)
      responses:
        "200": { description: Enabled; full session issued }
        "401": { description: Bad code }
        "409": { description: No pending enrolment }
  /v1/auth/totp/disable:
    post:
      tags: [auth]
      summary: Disable TOTP (full sessions; owners may not)
      responses:
        "204": { description: Disabled }
        "409": { description: Owner must keep TOTP }
  # --- Licensing (R5-2; normative contract is docs/fakeportal.md) -------

  /v1/activations:
    post:
      tags: [licences]
      summary: Activate an appliance against a licence key
      description: |
        Body: {licence_key, instance_id, public_key, name?,
        appliance_version?}. Issues a signed licence document plus apt
        credentials, registers the instance and binds its signing key.
        See docs/fakeportal.md for the document format and error codes.
      responses:
        "201": { description: Activated; licence document + apt_credentials }
        "400": { description: bad_request }
        "403": { description: licence revoked or expired }
        "404": { description: unknown_licence_key }
        "409": { description: seat_limit (max_instances reached) }
  /v1/check-ins:
    post:
      tags: [instances]
      summary: Instance check-in (SP-Ed25519 authenticated)
      description: |
        Records the appliance report and returns {status, licence,
        messages, latest_release, entitled_updates}. Auth scheme:
        `Authorization: SP-Ed25519 instance=.., key=.., ts=.., nonce=..,
        sig=..` — see docs/fakeportal.md.
      responses:
        "200": { description: Check-in accepted }
        "401": { description: bad_auth_header / stale_timestamp / wrong_key / bad_signature / replay }
        "429": { description: rate_limited }
  /v1/licence:
    get:
      tags: [licences]
      summary: Current licence document (SP-Ed25519 authenticated)
      description: Returns {status, licence, messages}; no report side effects.
      responses:
        "200": { description: Licence state }
        "401": { description: instance authentication failed }
  /v1/offline/activations:
    post:
      tags: [licences]
      summary: Air-gapped activation bundle (customer-auth stub)
      description: |
        Produces a downloadable signed licence bundle {bundle_version,
        licence, verification_keys, apt_credentials}. Until session auth
        lands (accounts wave) the credential is org_id + licence_key.
      responses:
        "201": { description: Bundle produced (Content-Disposition attachment) }
        "403": { description: licence does not belong to org }

  # --- Later waves: the versioned surface (no handlers yet) -------------

  /v1/organisations:
    get:
      tags: [organisations]
      summary: List my organisations
      responses:
        "200": { description: org + role list }
        "401": { description: Not authenticated }
  /v1/organisations/{orgId}:
    get:
      tags: [organisations]
      summary: Org detail + latest subscription
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200": { description: org, role, subscription }
        "403": { description: Not a member }
  /v1/organisations/{orgId}/members:
    get:
      tags: [organisations]
      summary: List org members
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200": { description: member list }
        "403": { description: Not a member }

  /v1/billing/subscription:
    get:
      tags: [billing]
      summary: Latest subscription for an org (any member)
      parameters:
        - { name: org_id, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: subscription }
        "404": { description: No subscription }
  /v1/billing/checkout:
    post:
      tags: [billing]
      summary: Create a Stripe Checkout Session (owner/admin)
      description: |
        Ensures the Stripe customer exists (created + linked on first
        use), then returns the hosted checkout URL. automatic_tax and
        tax_id_collection (ABN capture) are enabled as configured.
      responses:
        "200": { description: url + session_id }
        "400": { description: Unknown plan }
        "503": { description: Stripe not configured }
  /v1/billing/portal:
    post:
      tags: [billing]
      summary: Create a Stripe Customer Portal session (owner/admin)
      responses:
        "200": { description: url }
        "409": { description: No billing account yet }
        "503": { description: Stripe not configured }
  /v1/billing/invoices:
    post:
      tags: [billing]
      summary: Enterprise send-invoice purchase (owner/admin)
      description: |
        Creates a send_invoice Stripe subscription (no Checkout), records
        the ABN as an au_abn tax id when supplied and emails the hosted
        invoice URL to the org billing address.
      responses:
        "200": { description: subscription_id, invoice_id, hosted_invoice_url }
        "400": { description: Unknown plan }
        "503": { description: Stripe not configured }

  # --- Customer portal surface (R5-5) -------------------------------------

  /v1/auth/accept-invite:
    post:
      tags: [auth]
      summary: Consume a team invite (public)
      description: |
        Body {token, password?, display_name?}. A fresh invited user
        must supply a password (8+ chars); the email is marked verified
        and a full session is issued. An existing account's token is a
        no-op confirmation.
      responses:
        "200": { description: Accepted; session cookie set }
        "400": { description: bad_token / validation }
  /v1/organisations/{orgId}/invites:
    post:
      tags: [organisations]
      summary: Invite a member to the org (owner/admin)
      description: |
        Body {email, display_name?, role}. Creates the user row when
        needed plus the membership, then emails an accept-invite link.
      responses:
        "201": { description: Invited }
        "403": { description: Not owner/admin }
        "409": { description: already_member }
  /v1/organisations/{orgId}/members/{userId}:
    patch:
      tags: [organisations]
      summary: Change a member's role (owner/admin)
      description: Body {role}. The org's last owner cannot be demoted.
      responses:
        "200": { description: Updated }
        "409": { description: last owner }
    delete:
      tags: [organisations]
      summary: Remove a member (owner/admin)
      description: The org's last owner cannot be removed.
      responses:
        "204": { description: Removed }
        "409": { description: last owner }
  /v1/organisations/{orgId}/notification-prefs:
    get:
      tags: [organisations]
      summary: My notification preferences for the org
      responses:
        "200": { description: prefs (defaults when unset) }
    put:
      tags: [organisations]
      summary: Update my notification preferences
      description: |
        Body {notify_version_behind, notify_security_release,
        notify_licence_expiry, notify_billing}. Billing mail is never
        opt-out — the flag is forced on.
      responses:
        "200": { description: Saved }
  /v1/licences:
    get:
      tags: [licences]
      summary: List the org's licences (member)
      description: |
        ?org_id= — each row carries licence_key, kind, plan,
        max_instances, seats_used, computed status
        (active|expired|revoked), doc_issued/doc_hash, expiry.
      parameters:
        - { name: org_id, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: licences[] }
        "403": { description: Not a member }
  /v1/licences/{licenceId}:
    get:
      tags: [licences]
      summary: Licence detail + bound instances (member)
      parameters:
        - { name: licenceId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: licence + instances }
        "403": { description: Not a member }
        "404": { description: not_found }
  /v1/instances:
    get:
      tags: [instances]
      summary: List the org's registered appliances (member)
      description: |
        ?org_id= — name, fingerprint instance_id, appliance_version,
        status, suspected_clone, last_seen_at, licence_key.
      parameters:
        - { name: org_id, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: instances[] }
        "403": { description: Not a member }
  /v1/instances/{instanceId}:
    get:
      tags: [instances]
      summary: Instance detail + bound licence (member)
      parameters:
        - { name: instanceId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: instance + licence }
        "403": { description: Not a member }
        "404": { description: not_found }
  /v1/instances/{instanceId}/reports:
    get:
      tags: [instances]
      summary: Check-in history from instance_reports (member)
      parameters:
        - { name: instanceId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200": { description: reports[] newest first }
  /v1/instances/{instanceId}/deactivate:
    post:
      tags: [instances]
      summary: Decommission an appliance, freeing its seat (non-viewer)
      responses:
        "200": { description: Deactivated instance }
        "403": { description: Viewer role }
  /v1/releases:
    get:
      tags: [releases]
      summary: Published release catalogue (customer session)
      description: Lists published, non-withdrawn releases.
      responses:
        "200": { description: releases[] }
        "401": { description: Not authenticated }
  /v1/releases/{releaseId}/download-url:
    post:
      tags: [releases]
      summary: Mint a signed download URL (customer session)
      description: |
        Body {org_id}; the caller must be an org member and the org's
        licences carry the entitlement — the same older-versions rule
        as the appliance mint applies.
      responses:
        "201": { description: Signed URL }
        "403": { description: no_licence / entitlement_expired / not a member }
        "404": { description: not_found }
        "409": { description: not_published }
  # --- Release catalogue + distribution (R5-4; contract docs are
  # --- docs/fakeportal.md and docs/offline-bundles.md) ------------------

  /v1/admin/releases:
    post:
      tags: [releases]
      summary: Register a release (staff; CI upload leg)
      description: |
        multipart/form-data uploads the artifact inline (file part
        "artifact" + fields version/component/channel/notes/
        min_upgrade_from/security); application/json registers an
        artifact already staged under storage_dir/releases/
        ({artifact_path} + optional sha256, verified against the file).
      responses:
        "201": { description: Release registered }
        "400": { description: Validation or sha256_mismatch }
        "401": { description: Not authenticated }
        "403": { description: Not a platform admin }
        "409": { description: release_exists (component+version unique) }
    get:
      tags: [releases]
      summary: List catalogue releases (staff)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: releases[] newest first }
        "401": { description: Not authenticated }
        "403": { description: Not a platform admin }
  /v1/admin/releases/{releaseId}:
    patch:
      tags: [releases]
      summary: Edit release metadata (staff)
      description: Body {security?, min_upgrade_from?}; absent fields keep their value.
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated release }
        "404": { description: not_found }
  /v1/admin/releases/{releaseId}/publish:
    post:
      tags: [releases]
      summary: Publish a release (staff, idempotent)
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Published release }
        "404": { description: not_found }
        "409": { description: release_withdrawn }
  /v1/admin/releases/{releaseId}/withdraw:
    post:
      tags: [releases]
      summary: Withdraw a published release (staff)
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Withdrawn release }
        "404": { description: not_found }
  /v1/admin/releases/{releaseId}/offline-bundle:
    post:
      tags: [releases]
      summary: Generate a signed .spb offline bundle (staff)
      description: |
        Packs the release artifact into storage/offline-bundles/
        serverperch-<component>-<version>.spb signed by the bundle
        issuer (docs/offline-bundles.md).
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: bundle, sha256, size_bytes, kid, verification_keys }
        "404": { description: not_found }
        "409": { description: no_artifact }
  /v1/admin/offline-bundles:
    get:
      tags: [releases]
      summary: List generated offline bundles (staff)
      responses:
        "200": { description: bundles[] }
  /v1/admin/storage/prune:
    post:
      tags: [releases]
      summary: Prune unreferenced release artifacts (staff)
      description: |
        Body {dry_run?, include_withdrawn?}: deletes files under
        storage_dir/releases/ that no releases row references;
        include_withdrawn also drops withdrawn releases' artifacts.
      responses:
        "200": { description: removed paths + reclaimed bytes }
  /v1/releases/download-urls:
    post:
      tags: [releases]
      summary: Mint a signed download URL (SP-Ed25519)
      description: |
        Body {release_id} or {version, component?} -> {url, expires_at,
        release}. The release must be published; expired/revoked
        licences may only mint URLs for releases published on/before the
        licence's end (older-versions rule). See docs/fakeportal.md.
      responses:
        "201": { description: Signed URL (15m TTL) }
        "401": { description: instance authentication failed }
        "403": { description: no_licence / entitlement_expired }
        "404": { description: not_found }
        "409": { description: not_published }
  /v1/releases/{releaseId}/download:
    get:
      tags: [releases]
      summary: Download a release artifact (signed t= token)
      description: |
        The t= credential minted by /v1/releases/download-urls is the
        whole authorisation. Supports HTTP Range for resume.
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string } }
        - { name: t, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Artifact bytes }
        "206": { description: Partial content (Range) }
        "401": { description: bad_token / bad_signature }
        "403": { description: token_expired }
        "404": { description: not_found / no_artifact }
  /v1/support-bundles:
    post:
      tags: [instances]
      summary: Upload a diagnostic bundle (SP-Ed25519)
      description: |
        Raw archive body with Content-Type application/gzip,
        application/x-tar or application/octet-stream, max 64 MiB.
        Stored under storage_dir/support-bundles/<org>/<id>; retention
        90 days. Contract leg only — processing UI is a later wave.
      responses:
        "201": { description: id, size_bytes, expires_at }
        "401": { description: instance authentication failed }
        "413": { description: body_too_large }
        "415": { description: unsupported_media_type }

  # --- Staff admin (R5-5; session + is_platform_admin + TOTP) -------------

  /v1/admin/search:
    get:
      tags: [releases]
      summary: Staff cross-tenant search
      description: |
        ?q= — substring match across organisations (name/slug/billing
        email), users (email/display name), licences (key) and
        instances (name/fingerprint); 20 rows per section.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: organisations/users/licences/instances }
        "403": { description: Not staff / TOTP required }
  /v1/admin/organisations/{orgId}:
    get:
      tags: [releases]
      summary: Staff org drill-down
      responses:
        "200": { description: org + members + licences + instances + subscription }
        "404": { description: not_found }
  /v1/admin/licences:
    post:
      tags: [releases]
      summary: Issue a manual licence (staff)
      description: |
        Body {org_id, kind?, plan?, max_instances?, expires_at?};
        expires_at is RFC3339, empty means never.
      responses:
        "201": { description: Issued licence }
  /v1/admin/licences/{licenceId}/revoke:
    post:
      tags: [releases]
      summary: Revoke a licence (staff, idempotent)
      responses:
        "200": { description: Revoked licence }
        "404": { description: not_found }
  /v1/admin/licences/{licenceId}/reissue:
    post:
      tags: [releases]
      summary: Mint a replacement key and revoke the original (staff)
      responses:
        "201": { description: licence + supersedes }
        "404": { description: not_found }
  /v1/admin/estate:
    get:
      tags: [releases]
      summary: Fleet estate view (staff)
      description: Headline totals plus live instance count per version.
      responses:
        "200": { description: totals + versions }
  /v1/admin/audit-log:
    get:
      tags: [releases]
      summary: Audit log browse (staff)
      parameters:
        - { name: org_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: entries[] newest first }
  /v1/admin/support-bundles:
    get:
      tags: [releases]
      summary: List uploaded support bundles (staff hook)
      parameters:
        - { name: org_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: bundles[] }
  /v1/admin/support-bundles/{bundleId}/download:
    get:
      tags: [releases]
      summary: Download a support bundle (staff hook, audit-logged)
      parameters:
        - { name: bundleId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Bundle bytes }
        "404": { description: not_found / no_artifact }
  /apt/{path}:
    get:
      tags: [releases]
      summary: Appliance apt repository (basic auth)
      description: |
        Serves storage_dir/apt/ (dists/, pool/) with HTTP basic auth —
        the (instances.id, spapt_token) credentials minted at
        activation. Expired/revoked licences may fetch metadata and
        payload versions published on/before the licence end.
      parameters:
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Repository file }
        "401": { description: Missing/invalid apt credentials }
        "403": { description: entitlement_expired }
        "404": { description: not_found }

components:
  parameters:
    orgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
