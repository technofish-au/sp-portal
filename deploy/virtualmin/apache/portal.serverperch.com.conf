# portal.serverperch.com — customer portal vhost (SPA + customer API).
#
# Proxies to the sp-portal-app container in the sp-portal pod. No
# allow-list (public), no raised upload limit — customer-facing uploads
# are small; the 500 MB allowance lives on api.serverperch.com only.
#
# This file is a drop-in example of the Virtualmin-generated vhost —
# merge the marked proxy block into the generated vhost
# (/etc/apache2/sites-available/portal.serverperch.com.conf) rather than
# replacing it; Virtualmin manages TLS and the :80 -> :443 redirect.
#
# Required modules: ssl proxy proxy_http headers remoteip rewrite

<VirtualHost *:80>
    ServerName portal.serverperch.com

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName portal.serverperch.com

    # --- Virtualmin-managed TLS (Let's Encrypt) — see admin. vhost.
    SSLEngine on
    SSLCertificateFile      /home/serverperch/domains/portal.serverperch.com/ssl.cert
    SSLCertificateKeyFile   /home/serverperch/domains/portal.serverperch.com/ssl.key
    SSLCertificateChainFile /home/serverperch/domains/portal.serverperch.com/ssl.ca
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1

    # --- BEGIN sp-portal proxy block (merge into generated vhost) -------
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    ProxyTimeout     120
    RequestHeader    set X-Forwarded-Proto "https"
    # --- END sp-portal proxy block --------------------------------------
</VirtualHost>
</IfModule>
