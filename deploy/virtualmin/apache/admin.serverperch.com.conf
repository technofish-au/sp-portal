# admin.serverperch.com — staff admin vhost.
#
# The staff admin UI and /v1/admin/* API live inside the same sp-portal-app
# container as the customer portal; network-layer separation is this
# Apache `Require ip` allow-list in front of the admin hostname
# (09-release-roadmap.md R5 item 9).
#
# This file is a drop-in example of the Virtualmin-generated vhost.
# Virtualmin manages the ServerName, DocumentRoot, SSL* certificate
# directives and the :80 -> :443 redirect itself — when applying, merge
# the marked proxy + allow-list blocks into the generated vhost
# (/etc/apache2/sites-available/admin.serverperch.com.conf) rather than
# replacing the file, then `systemctl reload apache2`.
#
# Required modules: ssl proxy proxy_http headers remoteip
#   a2enmod ssl proxy proxy_http headers remoteip

<VirtualHost *:80>
    ServerName admin.serverperch.com

    # Everything goes to TLS.
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName admin.serverperch.com

    # --- Virtualmin-managed TLS (Let's Encrypt) -------------------------
    # Paths follow Virtualmin's sub-server convention
    # (/home/serverperch/domains/<sub-server>/ssl.*). Do not hand-edit:
    # Virtualmin rewrites them on certificate renewal. If the generated
    # vhost points elsewhere, keep the generated paths.
    SSLEngine on
    SSLCertificateFile      /home/serverperch/domains/admin.serverperch.com/ssl.cert
    SSLCertificateKeyFile   /home/serverperch/domains/admin.serverperch.com/ssl.key
    SSLCertificateChainFile /home/serverperch/domains/admin.serverperch.com/ssl.ca
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1

    # --- BEGIN sp-portal proxy block (merge into generated vhost) -------
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    ProxyTimeout     300
    RequestHeader    set X-Forwarded-Proto "https"

    # Staff-only allow-list. EVERYTHING under this hostname is restricted
    # — the SPA admin pages and /v1/admin/* share the origin. Replace the
    # example ranges with the office egress / VPN ranges; keep the IPv6
    # range in sync with the IPv4 policy.
    # REPLACE the example ranges below with real ones (Apache allows no
    # trailing comments on Require lines):
    #   203.0.113.0/24  office egress
    #   10.20.30.0/24   VPN
    #   2406:1234::/32  office IPv6 (keep in sync with the IPv4 policy)
    <Location />
        Require ip 203.0.113.0/24
        Require ip 10.20.30.0/24
        Require ip 2406:1234::/32
    </Location>
    # --- END sp-portal proxy block --------------------------------------

    # Defence in depth is already in the app: /v1/admin/* requires a
    # session whose user has is_platform_admin AND totp_enabled — this
    # allow-list just keeps the attack surface off the public internet.
</VirtualHost>
</IfModule>
