# api.serverperch.com — appliance licence API + Stripe webhook vhost.
#
# Proxies to the same sp-portal-app container as portal.serverperch.com.
# Tuned for R8 support-bundle uploads: PUT /v1/support-bundles/{ref} may
# carry up to 500 MB, so LimitRequestBody is 524288000 and ProxyTimeout
# is raised accordingly (09-release-roadmap.md R5 item 7).
#
# This file is a drop-in example of the Virtualmin-generated vhost —
# merge the marked proxy block into the generated vhost
# (/etc/apache2/sites-available/api.serverperch.com.conf) rather than
# replacing it; Virtualmin manages TLS and the :80 -> :443 redirect.
#
# Required modules: ssl proxy proxy_http headers remoteip rewrite

<VirtualHost *:80>
    ServerName api.serverperch.com

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.serverperch.com

    # --- Virtualmin-managed TLS (Let's Encrypt) — see admin. vhost for
    # why these lines are reference-only.
    SSLEngine on
    SSLCertificateFile      /home/serverperch/domains/api.serverperch.com/ssl.cert
    SSLCertificateKeyFile   /home/serverperch/domains/api.serverperch.com/ssl.key
    SSLCertificateChainFile /home/serverperch/domains/api.serverperch.com/ssl.ca
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1

    # --- BEGIN sp-portal proxy block (merge into generated vhost) -------
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader    set X-Forwarded-Proto "https"

    # 500 MB support-bundle uploads (max body enforced app-side too):
    # 500 * 1024 * 1024 = 524288000 bytes. 0 would mean unlimited — keep
    # the explicit cap.
    LimitRequestBody 524288000
    # Slow links uploading 500 MB can take minutes; 10 min headroom.
    ProxyTimeout 600

    # Stripe posts /stripe/webhook here; the app verifies the signature
    # against the raw body — never rewrite or buffer-stripping modules in
    # front of it.
    # --- END sp-portal proxy block --------------------------------------
</VirtualHost>
</IfModule>
