# admin.serverperch.com — staff admin vhost (R5-5).
#
# The staff admin UI and /v1/admin/* API live inside the same sp-portal
# app as the customer portal; network-layer separation is this Apache
# `Require ip` allow-list in front of the admin hostname. Apply the
# office/VPN ranges below, then `systemctl reload apache2`.
#
# Virtualmin drops per-domain Apache config under
# /etc/apache2/sites-available/admin.serverperch.com.conf — either paste
# the <Location>/<Require> block into the generated vhost or include
# this file from it.

<VirtualHost *:443>
    ServerName admin.serverperch.com

    # TLS + Let's Encrypt certificates are managed by Virtualmin.

    # Reverse-proxy to the sp-portal-app container (pod-internal port
    # published on localhost — keep this port out of the public
    # interfaces; the customer hostnames proxy to the same backend).
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    ProxyTimeout     300
    # Support-bundle uploads can be large.
    LimitRequestBody 524288000

    # Staff-only allow-list: office egress + VPN ranges. EVERYTHING under
    # this hostname is restricted — the SPA admin pages and /v1/admin/*
    # share the origin.
    <Location />
        Require ip 203.0.113.0/24      # office egress
        Require ip 10.20.30.0/24       # VPN
        Require ip 2406:1234::/32      # office IPv6 (keep in sync)
    </Location>

    # Defence in depth is already in the app: /v1/admin/* requires a
    # session whose user has is_platform_admin AND totp_enabled — this
    # allow-list just keeps the attack surface off the public internet.
</VirtualHost>
