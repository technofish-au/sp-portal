# Dev/eval compose for sp-portal: MariaDB with its unix socket shared into
# the app and worker containers (the production transport), plus a TCP port
# for host tooling. The schema is applied by `make dev-up` / `make migrate`.
#
#   make dev-up     # mariadb -> migrate -> app + worker
#   curl localhost:8880/healthz
name: sp-portal

services:
  mariadb:
    image: mariadb:11.4
    command:
      - --socket=/run/mysqld/mysqld.sock
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # SKIP LOCKED (the job queue) is fine under the default
      # REPEATABLE-READ; binlog stays off in dev.
      - --skip-log-bin
    environment:
      MARIADB_ROOT_PASSWORD: sp-portal-dev-root
      MARIADB_DATABASE: portal
      MARIADB_USER: portal
      MARIADB_PASSWORD: sp-portal-dev
    volumes:
      - mariadb-data:/var/lib/mysql
      - mysql-run:/run/mysqld
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: serve
    environment:
      PORTAL_HTTP_ADDR: ":8880"
      PORTAL_DB_SOCKET: /run/mysqld/mysqld.sock
      PORTAL_DB_NAME: portal
      PORTAL_DB_USER: portal
      PORTAL_DB_PASSWORD: sp-portal-dev
      PORTAL_STORAGE_DIR: /var/lib/sp-portal
      PORTAL_PUBLIC_BASE_URL: "http://localhost:8880"
      # Mailpit below catches outbound mail in dev (no auth/TLS on :1025).
      PORTAL_SMTP_HOST: mailpit
      PORTAL_SMTP_PORT: "1025"
      PORTAL_MAIL_FROM: "portal@serverperch.test"
      PORTAL_MAIL_FROM_NAME: "ServerPerch Portal (dev)"
      # Dev bypasses: auth_secret_file unset -> ephemeral session/TOTP key;
      # altcha_secret_file unset -> sign-up captcha disabled; no stripe_*
      # files -> billing endpoints answer 503 and the webhook is inert.
    volumes:
      - mysql-run:/run/mysqld
      - portal-data:/var/lib/sp-portal
    ports:
      - "127.0.0.1:8880:8880"
    depends_on:
      mariadb:
        condition: service_healthy
      # mailpit:
      #   condition: service_started
    healthcheck:
      test: ["CMD", "sp-portal", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: worker
    environment:
      PORTAL_DB_SOCKET: /run/mysqld/mysqld.sock
      PORTAL_DB_NAME: portal
      PORTAL_DB_USER: portal
      PORTAL_DB_PASSWORD: sp-portal-dev
      PORTAL_SMTP_HOST: mailpit
      PORTAL_SMTP_PORT: "1025"
      PORTAL_MAIL_FROM: "portal@serverperch.test"
      PORTAL_MAIL_FROM_NAME: "ServerPerch Portal (dev)"
      # Dev accelerates the past-due suspension sweep for manual testing.
      PORTAL_SUSPEND_SWEEP_INTERVAL: "5m"
    volumes:
      - mysql-run:/run/mysqld
      - portal-data:/var/lib/sp-portal
    # The image HEALTHCHECK probes the HTTP server; the worker serves no
    # HTTP (a jobs-table heartbeat is a later-wave concern).
    healthcheck:
      disable: true
    depends_on:
      mariadb:
        condition: service_healthy
      app:
        condition: service_started

  # Mailpit catches all outbound email in dev: SMTP on :1025, the caught
  # mail web UI on http://localhost:8025.
  # mailpit:
  #   image: axllent/mailpit:latest
  #   ports:
  #     - "127.0.0.1:1025:1025"
  #     - "127.0.0.1:8025:8025"

volumes:
  mariadb-data:
  mysql-run:
  portal-data:
